name: Upstream Update and Deploy

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: 9ac6048aa8fdd19bd60e7de83b64222e
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream source
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch --no-tags upstream main
          git checkout upstream/main -- .
          rm -f .github/workflows/deploy.yml .github/workflows/sync.yml .github/workflows/sync.yaml
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream source changes."
          else
            git commit -m "chore: sync upstream CF-Server-Monitor"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const source = fs.readFileSync('wrangler.toml', 'utf8')
          const marker = 'database_name = "server-monitor-db"'
          const databaseId = 'database_id = "b80b9852-1592-4ab1-a447-77b6bfb8f94d"'
          const config = source.includes(databaseId) ? source : source.replace(marker, `${marker}\n${databaseId}`)
          fs.writeFileSync('.wrangler-production.toml', config)
          JS
          npm run build:frontend
          npx wrangler deploy --config .wrangler-production.toml --minify --keep-vars

      - name: Explain skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == '' && (steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: echo "Upstream source synced; deployment skipped because CLOUDFLARE_API_TOKEN is not configured."
